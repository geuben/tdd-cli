[project]
name = "tdd-cli"
version = "0.1.0"
description = "Ledger-backed TDD process controller for autonomous coding agents"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
tdd = "tddcli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tddcli"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-json-report>=1.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
