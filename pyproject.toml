[project]
name = "tdd-cli"
dynamic = ["version"]
description = "Ledger-backed TDD process controller for autonomous coding agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "geuben" }]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]
keywords = ["tdd", "testing", "agents", "ai", "pytest", "vitest", "workflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/geuben/tdd-cli"
Repository = "https://github.com/geuben/tdd-cli"
Issues = "https://github.com/geuben/tdd-cli/issues"
Changelog = "https://github.com/geuben/tdd-cli/blob/main/CHANGELOG.md"

[project.scripts]
tdd = "tddcli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tddcli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tddcli"]

# `tdd docs` reads these from the installed package, so an agent never has to fetch
# the protocol spec over the network — and never reads a version of it that disagrees
# with the binary it is driving. Keep in step with `tddcli.docs.TOPICS`;
# tests/test_docs_command.py fails if a topic is not included here.
[tool.hatch.build.targets.wheel.force-include]
"docs/harness-integration.md" = "tddcli/_docs/docs/harness-integration.md"
"examples/plan.md" = "tddcli/_docs/examples/plan.md"
"examples/skills/tdd-drive/SKILL.md" = "tddcli/_docs/examples/skills/tdd-drive/SKILL.md"
"examples/skills/tdd-handoff/SKILL.md" = "tddcli/_docs/examples/skills/tdd-handoff/SKILL.md"
"examples/claude-code-hooks/README.md" = "tddcli/_docs/examples/claude-code-hooks/README.md"
"README.md" = "tddcli/_docs/README.md"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-json-report>=1.5", "pytest-xdist>=3.5", "ruff>=0.5", "zizmor>=1.29"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-n", "auto"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
